<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Bot</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 16px;
        padding: 2rem 3rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      p {
        margin-top: 0;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>AI Chat Bot</h1>
      <p>Simple chat window — type a message and receive an echo reply.</p>

      <ul id="messages" style="list-style:none;padding:0;margin:1rem 0;max-height:300px;overflow:auto;width:400px;">
      </ul>

      <form id="chat-form" style="display:flex;gap:8px;justify-content:center;">
        <input id="chat-input" type="text" placeholder="Say something..." style="flex:1;padding:8px;border-radius:8px;border:1px solid rgba(148,163,184,0.2);background:rgba(255,255,255,0.02);color:#e2e8f0;" />
        <button type="submit" style="padding:8px 12px;border-radius:8px;border:none;background:#2563eb;color:white;">Send</button>
      </form>
    </div>
    <script src="main.js"></script>
  </body>
</html>
